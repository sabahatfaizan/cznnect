name: Deploy email functions

# Deploys the custom, birthday-test and scheduled birthday email functions to Supabase.
# Requires the repository secret SUPABASE_ACCESS_TOKEN. SMTP/Resend secrets live in Supabase Edge Function secrets.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/send-custom-email/**'
      - 'supabase/functions/send-birthday-emails/**'
      - 'supabase/functions/send-birthday-test/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/deploy-email-function.yml'
  workflow_dispatch:

concurrency:
  group: deploy-email-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: quatnrlyzitmgsvqyzbi
    steps:
      - uses: actions/checkout@v4
      - name: Check the access token is set
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Add the repository secret SUPABASE_ACCESS_TOKEN first."; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy send-custom-email
        run: |
          set -o pipefail
          supabase functions deploy send-custom-email --project-ref "$PROJECT_REF" --use-api --yes 2>&1 | tee out.txt || { echo "::error title=send-custom-email deploy failed::$(grep -v '^$' out.txt | tail -n 12 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
      - name: Deploy send-birthday-test
        run: |
          set -o pipefail
          supabase functions deploy send-birthday-test --project-ref "$PROJECT_REF" --use-api --yes 2>&1 | tee out.txt || { echo "::error title=send-birthday-test deploy failed::$(grep -v '^$' out.txt | tail -n 12 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
      # The scheduled birthday job authenticates with CRON_SECRET rather than a user JWT.
      - name: Deploy send-birthday-emails
        run: |
          set -o pipefail
          supabase functions deploy send-birthday-emails --project-ref "$PROJECT_REF" --use-api --yes --no-verify-jwt 2>&1 | tee out.txt || { echo "::error title=send-birthday-emails deploy failed::$(grep -v '^$' out.txt | tail -n 12 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
