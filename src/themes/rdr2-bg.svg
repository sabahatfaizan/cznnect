<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0808"/>
      <stop offset=".3" stop-color="#2e1511"/>
      <stop offset=".5" stop-color="#6e2d1b"/>
      <stop offset=".63" stop-color="#c0662f"/>
      <stop offset=".72" stop-color="#eba85f"/>
      <stop offset=".74" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#0d0605"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ff9a4d" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff7a30" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="900" fill="url(#sky)"/>
  <g fill="#f5dfc0" opacity=".55">
