    <path d="M48 770 q-14 0-14-14 v-12 q0-6 5-6 t5 6 v10 q0 5 4 5Z"/>
    <path d="M62 756 q12 0 12-12 v-8 q0-6 5-6 t5 6 v10 q0 14-22 14Z"/>
    <path d="M360 810 V760 q0-7 6-7 t6 7 V810Z"/>
    <path d="M360 788 q-12 0-12-12 v-8 q0-5 4-5 t4 5 v8 q0 4 4 4Z"/>
