name: Build Cznnect APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Builds run one at a time, and a newer push replaces one still waiting, so an old build can never finish
# after a newer one and put the old APK back on the download link.
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Cznnect
        uses: actions/checkout@v5

      - name: Tell the app a build has started
        # Shows a "please wait" notice in the app while the new version is being published. Uses the same narrow
        # BUILD_TOKEN as the step that raises the required build. Skipped without the secret.
        continue-on-error: true
        env:
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          [ -n "$BUILD_TOKEN" ] || { echo "BUILD_TOKEN is not set."; exit 0; }
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" src/config.ts | head -1)
          ANON=$(grep "SUPABASE_ANON_KEY =" src/config.ts | sed -E "s/.*'([^']+)'.*/\1/")
          curl -sS --fail-with-body -X POST "$URL/rest/v1/rpc/set_build_status" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "Content-Type: application/json" \
            -d "{\"token\": \"${BUILD_TOKEN}\", \"building\": true}"; echo

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Install Capacitor
        # Not --no-save: Capacitor only wires up plugins that are listed in package.json. Installed but unlisted, the
        # notification plugin was silently left out of the APK (capacitor.plugins.json was empty), so reminders
        # never worked. This only changes the build's own copy of package.json, not the repository.
        run: npm install @capacitor/core @capacitor/android @capacitor/cli @capacitor/local-notifications

      - name: Create Android wrapper
        run: |
          npx cap init Cznnect com.sabahatfaizan.cznnect --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Check the notification plugin is in the app
        run: |
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -q local-notifications android/app/src/main/assets/capacitor.plugins.json

      - name: Add the Cznnect icons and native share
        # Capacitor's generated project ships its own default launcher icon and can't open the Android share
        # sheet from the web view. android-native/apply.py adds the Cznnect icons (one launcher entry per app
        # icon colour, so the home-screen icon follows the theme) and a small native plugin.
        run: python3 android-native/apply.py

      - name: Allow the camera in the APK
        # Capacitor's generated manifest has no camera permission, so Android refuses every camera request
        # (the QR scanner in Convoy) before the app can even ask. Declare it, and mark the camera optional so
        # the app still installs on devices without one.
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          lines = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />',
              '<uses-feature android:name="android.hardware.camera" android:required="false" />',
              '<uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />',
          ]
          need = [l for l in lines if l.split('"')[1] not in s]
          if need:
              s = s.replace('<application', '\n    '.join(need) + '\n\n    <application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "uses-permission\|uses-feature" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml

      - name: Add Firebase push to the APK
        # The native plugin's getPushToken uses the Firebase Messaging library, so the library is always added (the
        # code would not compile without it). The Firebase project's google-services.json (repository secret
        # GOOGLE_SERVICES_JSON) is what actually switches push on: Capacitor's generated Gradle files apply the
        # Google services plugin only when that file exists. Without the secret the build still passes and the app
        # simply has no push (getPushToken rejects and the web code gets null).
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          if 'firebase-messaging' not in s:
              s, n = re.subn(r'^dependencies \{', "dependencies {\n    implementation platform('com.google.firebase:firebase-bom:33.7.0')\n    implementation 'com.google.firebase:firebase-messaging'", s, count=1, flags=re.M)
              assert n == 1, 'dependencies block not found in app/build.gradle'
          open(p, 'w', encoding='utf-8').write(s)
          PY
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            grep -q google-services android/build.gradle android/app/build.gradle || { echo "Google services plugin is not wired by this Capacitor template"; exit 1; }
          else
            echo "GOOGLE_SERVICES_JSON is not set, so this build has no push."
          fi
          grep -n "firebase" android/app/build.gradle

      - name: Sign with the fixed Cznnect key and raise the version
        # GitHub makes a new throwaway debug key on every build, and Android refuses to update an app whose
        # signing key changed. A fixed key plus a version number that rises each build lets a new APK
        # install over the old one.
        run: |
          cp android-native/cznnect-debug.keystore android/app/cznnect-debug.keystore
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'versionCode\s+\d+', 'versionCode ' + __import__('os').environ['GITHUB_RUN_NUMBER'], s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "1.0.' + __import__('os').environ['GITHUB_RUN_NUMBER'] + '"', s, count=1)
          block = """
              signingConfigs {
                  debug {
                      storeFile file('cznnect-debug.keystore')
                      storePassword 'android'
                      keyAlias 'cznnect'
                      keyPassword 'android'
                  }
              }
          """
          assert 'buildTypes {' in s, 'buildTypes not found in build.gradle'
          s = s.replace('buildTypes {', block.strip('\n') + '\n    buildTypes {', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "versionCode\|versionName\|cznnect-debug" android/app/build.gradle

      - name: Keep Gradle downloads between builds
        # Once a build has downloaded its libraries they are kept here, so a later outage at Maven Central or
        # GitHub's release servers cannot stop an update that only needs files it already has.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        # Downloads sometimes fail for a few minutes (a 504 from GitHub's or Maven's servers). Up to 5 tries with a
        # longer wait each time turns that into a slower build instead of a missing update.
        run: |
          cd android
          for attempt in 1 2 3 4 5; do
            ./gradlew assembleDebug && exit 0
            echo "Build attempt $attempt failed."
            [ "$attempt" -lt 5 ] && sleep $((attempt * 45))
          done
          exit 1

      - name: Give APK a unique build filename
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/cznnect-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: cznnect-apk-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/cznnect-${{ github.run_number }}-${{ github.sha }}.apk
          if-no-files-found: error

      - name: Publish newest APK to the latest-apk release
        # A rolling release with a fixed file name, so the maintenance screen can link to
        # https://github.com/sabahatfaizan/cznnect/releases/download/latest-apk/cznnect.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "android/app/build/outputs/apk/debug/cznnect-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}.apk" cznnect.apk
          # Never put an older build over a newer one (the notes always start with "Build <number>").
          CURRENT=$(gh release view latest-apk --json body -q .body 2>/dev/null | sed -n 's/^Build \([0-9][0-9]*\).*/\1/p' | head -1)
          if [ -n "$CURRENT" ] && [ "$CURRENT" -gt "$GITHUB_RUN_NUMBER" ]; then
            echo "Build $CURRENT is already published and newer than $GITHUB_RUN_NUMBER, so the download link is left alone."
            exit 0
          fi
          if ! gh release view latest-apk >/dev/null 2>&1; then
            gh release create latest-apk --title "Latest Cznnect APK" --notes "Always the newest build. Updated automatically on every push to main." --target "$GITHUB_SHA"
          fi
          gh release upload latest-apk cznnect.apk --clobber
          gh release edit latest-apk --notes "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7}). Updated automatically on every push to main."

      - name: Raise the required app build to this build (only while forced updates are on)
        # Only when the owner has forced updates on (min_build above 0) AND switched on "Always require the newest
        # build" in Admin (supabase/21_min_build_auto_raise.sql), every new APK becomes the required build. A build
        # number set by hand stays as set. It runs after the APK is published, so people sent to the download always
        # get the new file.
        # Uses the repository secret BUILD_TOKEN, which can only call raise_min_build (supabase/12_build_token.sql)
        # and cannot read or change anything else. Without the secret this step is skipped and the build still passes.
        continue-on-error: true
        env:
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          if [ -z "$BUILD_TOKEN" ]; then
            echo "BUILD_TOKEN is not set, so the required build was not changed."
            exit 0
          fi
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" src/config.ts | head -1)
          ANON=$(grep "SUPABASE_ANON_KEY =" src/config.ts | sed -E "s/.*'([^']+)'.*/\1/")
          [ -n "$URL" ] && [ -n "$ANON" ] || { echo "Could not read the Supabase settings from src/config.ts"; exit 1; }
          BODY=$(curl -sS --fail-with-body -X POST "$URL/rest/v1/rpc/raise_min_build" \
            -H "apikey: $ANON" \
            -H "Authorization: Bearer $ANON" \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"${BUILD_TOKEN}\", \"build\": ${GITHUB_RUN_NUMBER}}")
          echo "Result: $BODY"

      - name: Refresh the website so it carries this build's APK
        # The website keeps its own copy of the APK as a backup download. This redeploys it with the new build.
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Tell the app the build has finished
        # Clears the "please wait" notice, even when the build failed. Uses the same narrow
        # BUILD_TOKEN as the step that raises the required build. Skipped without the secret.
        if: always()
        continue-on-error: true
        env:
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          [ -n "$BUILD_TOKEN" ] || { echo "BUILD_TOKEN is not set."; exit 0; }
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" src/config.ts | head -1)
          ANON=$(grep "SUPABASE_ANON_KEY =" src/config.ts | sed -E "s/.*'([^']+)'.*/\1/")
          curl -sS --fail-with-body -X POST "$URL/rest/v1/rpc/set_build_status" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "Content-Type: application/json" \
            -d "{\"token\": \"${BUILD_TOKEN}\", \"building\": false}"; echo
