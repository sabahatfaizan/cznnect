name: Build Cznnect APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Cznnect
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/android @capacitor/cli

      - name: Create Android wrapper
        run: |
          npx cap init Cznnect com.sabahatfaizan.cznnect --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Give APK a unique build filename
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/cznnect-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: cznnect-apk-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/cznnect-${{ github.run_number }}-${{ github.sha }}.apk
          if-no-files-found: error
