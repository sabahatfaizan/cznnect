  <path d="M0 790 Q110 762 220 786 T400 774 L400 900 L0 900Z" fill="#150a06"/>
  <rect y="840" width="400" height="60" fill="#0a0504"/>
  <!-- telegraph line -->
  <g stroke="#0c0504" fill="none" stroke-linecap="round">
    <path d="M96 596 V792" stroke-width="5"/>
    <path d="M82 614 H112" stroke-width="3.5"/>
    <path d="M86 630 H108" stroke-width="3"/>
    <path d="M96 614 Q220 650 330 614" stroke-width="1.2" opacity=".85"/>
    <path d="M96 630 Q220 668 330 632" stroke-width="1.2" opacity=".85"/>
    <path d="M330 590 V780" stroke-width="4"/>
    <path d="M318 610 H344" stroke-width="3"/>
    <path d="M330 628 H342" stroke-width="2.6"/>
  </g>
