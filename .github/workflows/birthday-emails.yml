name: Birthday emails

# Every morning, asks Supabase to email everyone whose birthday is today (the send-birthday-emails function).
# One-time setup: add a repository secret called CRON_SECRET, with the same text as the CRON_SECRET secret on the function.
# "Run workflow" lets you try it by hand; tick "dry" to only see who would get an email.

on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC, which is 08:30 in Dhaka
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run: list who would get an email, send nothing'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      FUNCTION_URL: https://quatnrlyzitmgsvqyzbi.supabase.co/functions/v1/send-birthday-emails
    steps:
      - name: Check the secret is set
        run: test -n "$CRON_SECRET" || { echo "Add the repository secret CRON_SECRET first (see the note at the top of this file)."; exit 1; }
      - name: Send today's birthday emails
        run: |
          url="$FUNCTION_URL"
          if [ "${{ inputs.dry }}" = "true" ]; then url="$url?dry=1"; fi
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST -H "x-cron-secret: $CRON_SECRET" "$url")
          cat response.json; echo
          test "$status" -ge 200 -a "$status" -lt 300
