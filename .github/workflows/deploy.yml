name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Run automated regression tests
        run: npm test
      - name: Type-check application
        run: npm run typecheck
      - name: Build production app
        run: npm run build
      - name: Add the newest app download to the website
        # A second place to download the APK, on the website's own address, for networks where GitHub's release
        # download server is slow. It is skipped quietly if there is no release yet.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download latest-apk --pattern cznnect.apk --dir dist --clobber || echo "No APK release yet, skipping."
      - name: Verify deployment artifact
        run: test -s dist/index.html && test -s dist/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
