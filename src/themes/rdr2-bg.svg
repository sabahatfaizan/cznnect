<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f27a35"/>
      <stop offset=".35" stop-color="#ff8f3f"/>
      <stop offset=".62" stop-color="#ffb36b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>
    </radialGradient>
    <g id="saguaro" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 V-150" stroke-width="18"/>
      <path d="M0 -55 H-30 V-105" stroke-width="12"/>
      <path d="M0 -85 H32 V-130" stroke-width="12"/>
    </g>
    <g id="saguaro2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 V-120" stroke-width="16"/>
      <path d="M0 -45 H26 V-85" stroke-width="11"/>
    </g>
    <g id="agave" fill="none" stroke-linecap="round">
      <path d="M0 0 L-22 -34 M0 0 L-10 -44 M0 0 L0 -48 M0 0 L10 -44 M0 0 L22 -34 M0 0 L-30 -16 M0 0 L30 -16" stroke-width="5"/>
    </g>
  </defs>

  <rect width="400" height="900" fill="url(#sky)"/>
  <circle cx="150" cy="470" r="170" fill="url(#glow)"/>
  <circle cx="150" cy="470" r="38" fill="#ffd2a6"/>

  <!-- far spires -->
  <g fill="#e07a3c">
    <path d="M30 620 V540 H48 V515 H72 V540 H88 V620 Z"/>
    <path d="M232 620 V500 H246 V470 H288 V500 H304 V620 Z"/>
  </g>
  <path d="M0 610 C90 585 190 600 280 612 C340 620 380 605 400 608 V900 H0 Z" fill="#d96f33"/>

  <!-- mid mesa and hills -->
  <path d="M150 680 V610 H172 V588 H236 V610 H262 V598 H296 V680 Z" fill="#b5501f"/>
  <path d="M0 650 C80 620 170 632 250 652 C320 668 365 640 400 648 V900 H0 Z" fill="#b5501f"/>
  <path d="M0 705 C110 675 230 705 320 695 C360 690 385 697 400 694 V900 H0 Z" fill="#8f3a14"/>

  <!-- right butte -->
  <path d="M312 720 V470 H326 V440 H358 V452 H386 V432 H400 V720 Z" fill="#7a2f10"/>
  <!-- left cliff -->
  <path d="M0 780 V430 H28 V452 H52 V570 L82 650 L118 720 V780 Z" fill="#3d1508"/>

  <!-- foreground -->
  <path d="M0 790 C110 768 250 800 400 780 V900 H0 Z" fill="#3d1508"/>
  <g fill="#3d1508" stroke="#3d1508">
    <use href="#saguaro" transform="translate(148 800) scale(1.1)"/>
    <use href="#saguaro2" transform="translate(268 806) scale(0.9)"/>
    <use href="#agave" transform="translate(212 806)"/>
    <use href="#agave" transform="translate(352 800) scale(1.1)"/>
    <ellipse cx="60" cy="812" rx="30" ry="11"/>
  </g>
</svg>
