  <g fill="#120907">
    <ellipse cx="196" cy="806" rx="26" ry="9"/><ellipse cx="230" cy="812" rx="16" ry="6"/><ellipse cx="22" cy="838" rx="22" ry="8"/><ellipse cx="320" cy="842" rx="28" ry="9"/>
