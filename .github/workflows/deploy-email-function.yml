name: Deploy email functions

# Puts the email functions (send-custom-email and send-birthday-emails) on Supabase whenever their code changes on main (or when you press "Run workflow").
# One-time setup: add a repository secret called SUPABASE_ACCESS_TOKEN (make it at supabase.com/dashboard/account/tokens).
# (Needs a Supabase token that is allowed to write Edge Functions.)
# The SMTP_* secrets live in Supabase itself (Edge Functions > Secrets), not here.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/send-custom-email/**'
      - 'supabase/functions/send-birthday-emails/**'
      - 'supabase/functions/send-birthday-test/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/deploy-email-function.yml'
  workflow_dispatch:

concurrency:
  group: deploy-email-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: quatnrlyzitmgsvqyzbi
    steps:
      - uses: actions/checkout@v4
      - name: Check the access token is set
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Add the repository secret SUPABASE_ACCESS_TOKEN first (see the note at the top of this file)."; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy send-custom-email
        run: |
          set -o pipefail
          supabase functions deploy send-custom-email --project-ref "$PROJECT_REF" --use-api --yes 2>&1 | tee out.txt || { echo "::error title=send-custom-email deploy failed::$(grep -v '^$' out.txt | tail -n 12 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
      - name: Deploy send-birthday-test
        run: |
          set -o pipefail
          supabase functions deploy send-birthday-test --project-ref "$PROJECT_REF" --use-api --yes 2>&1 | tee out.txt || { echo "::error title=send-birthday-test deploy failed::$(grep -v '^
      - name: Deploy send-birthday-emails
        run: |
          set -o pipefail
          supabase functions deploy send-birthday-emails --project-ref "$PROJECT_REF" --use-api --yes --no-verify-jwt 2>&1 | tee out.txt || { echo "::error title=send-birthday-emails deploy failed::$(grep -v '^$' out.txt | tail -n 12 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
 out.txt | tail -n 12 | tr '\\n' ' ' | cut -c1-900)"; exit 1; }
      # No login check on this one: the daily job has no login, it sends a secret instead.
      - name: Deploy send-birthday-emails
        run: |
          set -o pipefail
          supabase functions deploy send-birthday-emails --project-ref "$PROJECT_REF" --use-api --yes --no-verify-jwt 2>&1 | tee out.txt || { echo "::error title=send-birthday-emails deploy failed::$(grep -v '^$' out.txt | tail -n 12 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
